<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{{ title }} | Recruvoskill</title>
  <meta name="description" content="{{ meta_description }}" />
  <link rel="canonical" href="{{ canonical_url }}" />

  <meta property="og:type" content="website" />
  <meta property="og:title" content="{{ title }} | Recruvoskill" />
  <meta property="og:description" content="{{ meta_description }}" />
  <meta property="og:url" content="{{ canonical_url }}" />
  <meta property="og:site_name" content="Recruvoskill" />

  <meta name="twitter:card" content="summary" />
  <meta name="twitter:title" content="{{ title }} | Recruvoskill" />
  <meta name="twitter:description" content="{{ meta_description }}" />

  <script type="application/ld+json">
  {{ json_ld | safe }}
  </script>

  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; max-width: 760px; margin: 0 auto; padding: 2.5rem 1.5rem; color: #1f2937; line-height: 1.6; }
    h1 { font-size: 1.75rem; margin-bottom: 0.25rem; }
    .brand { color: #4f46e5; font-weight: 800; text-decoration: none; font-size: 0.95rem; }
    .task { border: 1px solid #e5e7eb; border-radius: 8px; padding: 0.9rem 1rem; margin-bottom: 0.6rem; }
    .task h3 { margin: 0 0 0.25rem 0; font-size: 1rem; }
    .cta { display: inline-block; margin-top: 1.5rem; background: #4f46e5; color: white; padding: 0.75rem 1.5rem; border-radius: 6px; text-decoration: none; font-weight: 600; }
    .meta { color: #6b7280; font-size: 0.9rem; margin-bottom: 1.5rem; }
  </style>
</head>
<body>
  <a class="brand" href="{{ frontend_base_url }}">Recruvoskill</a>
  <h1>{{ title }}</h1>
  <p class="meta">Outcome-based role &middot; Posted {{ posted_date }}</p>

  <p>{{ description }}</p>

  {% if tasks %}
  <h2>What you'll be evaluated on</h2>
  {% for task in tasks %}
  <div class="task">
    <h3>{{ task.title }}</h3>
  </div>
  {% endfor %}
  {% endif %}

  <a class="cta" href="{{ apply_url }}">Apply with your GitHub repo</a>
</body>
</html>
